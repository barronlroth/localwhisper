name: LocalWhisper
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LocalWhisper:
    type: application
    platform: iOS
    sources:
      - path: LocalWhisper
      - path: Shared
    entitlements:
      path: LocalWhisper/LocalWhisper.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: LocalWhisper/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROVISIONING_PROFILE)
    dependencies:
      - target: LocalWhisperKeyboard
        embed: true

  LocalWhisperKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: LocalWhisperKeyboard
      - path: Shared
    entitlements:
      path: LocalWhisperKeyboard/LocalWhisperKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEYBOARD_BUNDLE_ID)
        INFOPLIST_FILE: LocalWhisperKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        PROVISIONING_PROFILE_SPECIFIER: $(KB_PROVISIONING_PROFILE)

schemes:
  LocalWhisper:
    build:
      targets:
        LocalWhisper: all
        LocalWhisperKeyboard: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
