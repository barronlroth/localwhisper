[project]
name = "localwhisper-server"
version = "0.1.0"
description = "Local Apple Silicon Parakeet MLX transcription server for LocalWhisper iOS keyboard"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "numpy>=2.0.0",
    "parakeet-mlx>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
